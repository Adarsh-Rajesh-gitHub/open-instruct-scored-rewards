# Written by edullm check, from config/workload-catalog.yaml in /home/tom/code/alpha/eduLLM/platform/config.
# Everything here is a property of the code and travels with it in git.
# The machine, the corpus and the experiment are supplied at submit time,
# because one commit run by two people belongs to two teams.
#
# Workload profiles registered for open-instruct-scored-rewards: open-instruct-scored-rewards-check, open-instruct-scored-rewards-train.
# edullm check prices this and lists every refusal, without dispatching anything.
schema_version: 1
# PRM-vs-ORM Stage 1: data prep. Reads the published PRM800K corpus in-job via
# edullm_data (job role), grades outcome labels with open-instruct's own MathVerifier,
# and writes the SFT / ORM / PRM corpora plus GSM8K/MATH prompt and eval sets to the
# run's checkpoint prefix. CPU-only (no tokenizer, no torch training); the -train
# profile is required because this is the first stage that WRITES outputs.
workload_profile: open-instruct-scored-rewards-train
# devices: 0 -- pure data transform + S3 I/O; a CPU box is right and cheapest.
# Overridable at submit with --compute.
suggested_compute: cpu-32vcpu
# $EDULLM_CHECKPOINT_DIR is the writable s3:// prefix the platform hands the job; the
# script uploads every corpus there itself (the platform does not sync local files).
command: >-
  bash -lc 'python projects/prm_vs_orm/data_prep.py --out "$EDULLM_CHECKPOINT_DIR"'
