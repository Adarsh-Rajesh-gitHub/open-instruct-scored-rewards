name: Tests

# THIS FILE DELIBERATELY DIVERGES FROM allenai/open-instruct, WHICH IT WAS OTHERWISE
# BYTE-IDENTICAL TO. Do not restore either difference from upstream on the next sync.
#
# 1. `runs-on` was `8-Core-XL-Runner-Ubuntu-Latest`, an Allen AI runner label. This
#    organization has no self-hosted runners at all, so both jobs queued forever and the
#    workflow had never once completed. A queued job renders as a pending yellow dot, which
#    reads as a check about to pass rather than a check that is absent, and it would block
#    every merge here the day required status checks are switched on.
#
# 2. The `gpu-tests` job was deleted rather than moved. It never used the runner's GPU -- it
#    built an image and ran the tests on Allen AI's Beaker cluster, against
#    `secrets.BEAKER_TOKEN` and the `ai2/open-instruct-dev` workspace. Neither the secret nor
#    an account to authenticate exists here, and eduLLM's GPU path is AWS Batch by way of
#    `edullm submit`, not Beaker. The five `open_instruct/test_*_gpu.py` files it ran now
#    deselect themselves: conftest.py already drops them when `torch.cuda.is_available()` is
#    false, so they are skipped rather than silently passed.

on:
  pull_request:
    branches:
      - main
  merge_group:

jobs:

  unit-tests:
    name: Run unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash -euo pipefail {0}
    steps:

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.8.6"
      - name: Set up Python
        run: uv sync --frozen
      - name: Run unit tests
        run: uv run --frozen pytest
